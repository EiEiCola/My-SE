version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: team12-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - team12-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Go)
  backend:
    image: juribers/team12-backend:latest
    container_name: team12-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      # Env นี้จะถูก Override ตอนรันบน Server ได้
      ALLOWED_ORIGINS: "http://localhost"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - team12-network

  # Frontend (React + Vite)
  frontend:
    # ⚠️ เปลี่ยน YOUR_DOCKER_HUB_USER เป็นชื่อ User ของคุณ
    image: juribers/team12-frontend:latest
    container_name: team12-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - team12-network

networks:
  team12-network:
    driver: bridge

volumes:
  postgres_data:
