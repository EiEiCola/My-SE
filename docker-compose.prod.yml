services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: team12-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - team12-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Go API)
  backend:
    image: juribers/team12-backend:latest
    container_name: team12-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads # Persist uploaded files
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-postgres}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://sutcommu.online,http://sutcommu.online}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - team12-network
      - web_network # Connect to Nginx Proxy Manager

  # Frontend (React + Vite + Nginx)
  frontend:
    image: juribers/team12-frontend:latest
    container_name: team12-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - team12-network
      - web_network # Connect to Nginx Proxy Manager

networks:
  team12-network:
    driver: bridge
  web_network:
    name: team12_npm_internal
    external: true

volumes:
  postgres_data:
