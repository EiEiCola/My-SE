services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: team12-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - team12-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Go)
  backend:
    image: juribers/team12-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: team12-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      ALLOWED_ORIGINS: "http://localhost" # Default for local, override in prod
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - team12-network

  # Frontend (React + Vite)
  frontend:
    image: juribers/team12-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: team12-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - team12-network

networks:
  team12-network:
    driver: bridge

volumes:
  postgres_data:
